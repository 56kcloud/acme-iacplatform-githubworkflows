name: Deploy

on:
  workflow_call:
    inputs:
      deploy-env:
        description: Environment directory, also the GitHub environment name, e.g. prod.
        required: true
        type: string
      action:
        description: The caller's workflow_dispatch action (plan or apply). Ignored on push and pull_request.
        required: false
        type: string
        default: plan
      aws-account-id:
        description: AWS account to deploy to. Empty skips AWS credentials, for testing without AWS.
        required: false
        type: string
        default: ""
    secrets:
      GITHUBMCH_REPOS_READ_APP_PRIVATE_KEY:
        required: true
      TFC_REGISTRY_READ_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
  AWS_REGION: "eu-central-2"
  AWS_DEPLOY_ROLE: "acme-github-deploy"
  DEPLOY_ENV: ${{ inputs.deploy-env }}
  TF_ACTION: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')) && 'apply' || 'plan' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.deploy-env }}
    environment:
      name: ${{ inputs.deploy-env }}
      deployment: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # OIDC for AWS credentials
      pull-requests: write  # Terraform plan as PR comment

    steps:
      - name: Require main for apply
        if: env.TF_ACTION == 'apply' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply runs only on main, got $GITHUB_REF"
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          version: 2026.9.16
          working_directory: ${{ env.DEPLOY_ENV }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITHUBMCH_REPOS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUBMCH_REPOS_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] read-only token for private module sources org-wide, by decision
          permission-contents: read

      - name: Configure git credentials for GitHub module refs
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -diff -recursive

      - name: terraform-docs
        id: docs
        working-directory: ${{ env.DEPLOY_ENV }}/
        run: terraform-docs . --output-check

      - name: Vendored config check
        id: configs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHARED_REPO: ${{ job.workflow_repository }}
          SHARED_SHA: ${{ job.workflow_sha }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${SHARED_REPO}/contents/scripts/config_sync.py?ref=${SHARED_SHA}" > "$RUNNER_TEMP/config_sync.py"
          mise x python@3.12 -- python3 "$RUNNER_TEMP/config_sync.py" check --env-dir "$DEPLOY_ENV"

      - name: TFLint
        id: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ env.DEPLOY_ENV }}/
        run: |
          tflint --init
          tflint

      - name: Configure AWS credentials
        if: env.AWS_ACCOUNT_ID != ''
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_DEPLOY_ROLE }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        id: init
        working-directory: ${{ env.DEPLOY_ENV }}/
        env:
          # Used for fetching modules from the private Terraform registry
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_REGISTRY_READ_TOKEN }}
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        if: env.TF_ACTION == 'plan'
        working-directory: ${{ env.DEPLOY_ENV }}/
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        id: apply
        if: env.TF_ACTION == 'apply'
        working-directory: ${{ env.DEPLOY_ENV }}/
        run: terraform apply -input=false -auto-approve

      # Nothing past this point touches AWS: drop the deploy role's session
      # before running any plan reporting or scanning steps below.
      - name: Drop AWS credentials
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_REGION="
            echo "AWS_DEFAULT_REGION="
          } >> "$GITHUB_ENV"

      - name: Post plan comment
        id: comment
        if: env.TF_ACTION == 'plan' && github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@d177dfb833ccfb6ef6022700796190dfe54830f1 # v3.0.0
        with:
          token: ${{ github.token }}
          planfile: tfplan
          working-directory: ${{ env.DEPLOY_ENV }}/
          header: "📝 Terraform Plan: ${{ env.DEPLOY_ENV }}"

      - name: Trivy plan scan
        id: trivy
        if: env.TF_ACTION == 'plan'
        working-directory: ${{ env.DEPLOY_ENV }}/
        run: >-
          trivy config
          --config trivy.yaml
          --ignorefile .trivyignore
          tfplan

      - name: Checkov plan scan
        id: checkov
        if: env.TF_ACTION == 'plan'
        working-directory: ${{ env.DEPLOY_ENV }}/
        env:
          # Let Checkov recover #checkov:skip comments that live inside a called
          # module. Checkov ignores dot-directories by default, and also
          # hardcodes .terraform (where module source lives) in its ignore list.
          # Disable both, keeping the rest of the default ignore list as is.
          CHECKOV_EXPERIMENTAL_TERRAFORM_MANAGED_MODULES: true
          CKV_IGNORE_HIDDEN_DIRECTORIES: false
          CKV_IGNORED_DIRECTORIES: "node_modules,.serverless"
        run: |
          terraform show -json tfplan > tfplan.json
          checkov \
            --config-file .checkov.yml \
            --repo-root-for-plan-enrichment . \
            -f tfplan.json

      - name: Remove git credentials
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global --get-regexp '^url\.https://x-access-token:' >/dev/null || exit 0
          git config --global --remove-section "url.https://x-access-token:${APP_TOKEN}@github.com/"

      - name: Step summary
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          CONFIGS: ${{ steps.configs.outcome }}
          TFLINT: ${{ steps.tflint.outcome }}
          INIT: ${{ steps.init.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          COMMENT: ${{ steps.comment.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          CHECKOV: ${{ steps.checkov.outcome }}
        run: |
          {
            echo "### Deploy ${DEPLOY_ENV}: ${TF_ACTION}"
            echo
            echo "| check | result |"
            echo "|---|---|"
            echo "| terraform fmt | ${FMT:-not run} |"
            echo "| terraform-docs | ${DOCS:-not run} |"
            echo "| vendored configs | ${CONFIGS:-not run} |"
            echo "| TFLint | ${TFLINT:-not run} |"
            echo "| terraform init | ${INIT:-not run} |"
            echo "| terraform plan | ${PLAN:-not run} |"
            echo "| terraform apply | ${APPLY:-not run} |"
            echo "| plan comment | ${COMMENT:-not run} |"
            echo "| Trivy | ${TRIVY:-not run} |"
            echo "| Checkov | ${CHECKOV:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
