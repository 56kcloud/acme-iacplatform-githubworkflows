name: probe-interface

# Sandbox probe; see the deploy README.

on:
  workflow_call:
    secrets:
      probe-secret:
        required: false
      probe-multiline-secret:
        required: false
      never-passed:
        required: false

jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Boundary checks
        shell: bash
        env:
          NEVER_PASSED_EMPTY: ${{ secrets.never-passed == '' }}
          PROBE_SECRET_SET: ${{ secrets.probe-secret != '' }}
        run: |
          {
            echo "### Reusable workflow interface"
            echo "| check | result |"
            echo "|---|---|"
            echo "| caller workflow-level env CALLER_ENV | \`${CALLER_ENV:-<unset>}\` |"
            echo "| unpassed optional secret == '' | $NEVER_PASSED_EMPTY |"
            echo "| probe-secret passed | $PROBE_SECRET_SET |"
            echo "| id-token available | $([[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] && echo yes || echo no) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: OIDC claims
        uses: 56kcloud/acme-iacplatform-githubworkflows/.github/actions/oidc-claims@main
        with:
          label: probe-interface (${{ github.event_name }}, via reusable workflow)

      - name: Secret as a composite input
        uses: 56kcloud/acme-iacplatform-githubworkflows/.github/actions/probe-composite-secret@main
        with:
          secret-value: ${{ secrets.probe-secret }}
          multiline-secret-value: ${{ secrets.probe-multiline-secret }}
