name: CI

on:
  workflow_call:
    secrets:
      GITHUBMCH_REPOS_READ_APP_PRIVATE_KEY:
        required: true
      TFC_REGISTRY_READ_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          version: 2026.9.16

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITHUBMCH_REPOS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUBMCH_REPOS_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] read-only token for private module sources org-wide, by decision
          permission-contents: read

      - name: Configure git credentials for GitHub module refs
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: mise.toml fmt
        id: mise-fmt
        run: mise fmt --check

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -diff -recursive

      - name: terraform-docs
        id: docs
        run: terraform-docs . --output-check

      - name: Vendored config check
        id: configs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHARED_REPO: ${{ job.workflow_repository }}
          SHARED_SHA: ${{ job.workflow_sha }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${SHARED_REPO}/contents/scripts/config_sync.py?ref=${SHARED_SHA}" > "$RUNNER_TEMP/config_sync.py"
          mise x python@3.12 -- python3 "$RUNNER_TEMP/config_sync.py" check --profile module --env-dir .

      - name: TFLint
        id: tflint
        run: |
          tflint --init
          tflint --recursive --config "$(pwd)/.tflint.hcl"

      - name: Trivy IaC scan
        id: trivy
        run: trivy config .

      - name: Checkov
        id: checkov
        run: checkov -d . --config-file .checkov.yml

      - name: terraform init
        id: init
        env:
          # Used for fetching modules from the private Terraform registry
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_REGISTRY_READ_TOKEN }}
        run: terraform init -input=false

      - name: terraform validate
        id: validate
        run: terraform validate

      - name: terraform test
        id: test
        run: terraform test

      - name: Remove git credentials
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global --get-regexp '^url\.https://x-access-token:' >/dev/null || exit 0
          git config --global --remove-section "url.https://x-access-token:${APP_TOKEN}@github.com/"

      - name: Step summary
        if: always()
        env:
          MISE_FMT: ${{ steps.mise-fmt.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          CONFIGS: ${{ steps.configs.outcome }}
          TFLINT: ${{ steps.tflint.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          CHECKOV: ${{ steps.checkov.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "### Module CI"
            echo
            echo "| check | result |"
            echo "|---|---|"
            echo "| mise.toml fmt | ${MISE_FMT:-not run} |"
            echo "| terraform fmt | ${FMT:-not run} |"
            echo "| terraform-docs | ${DOCS:-not run} |"
            echo "| vendored configs | ${CONFIGS:-not run} |"
            echo "| TFLint | ${TFLINT:-not run} |"
            echo "| Trivy | ${TRIVY:-not run} |"
            echo "| Checkov | ${CHECKOV:-not run} |"
            echo "| terraform init | ${INIT:-not run} |"
            echo "| terraform validate | ${VALIDATE:-not run} |"
            echo "| terraform test | ${TEST:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
