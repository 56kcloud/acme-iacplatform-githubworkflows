name: oidc-claims
description: Print an allowlist of OIDC claims. Never the token.
inputs:
  label:
    description: Row label in the step summary.
    required: true
  audience:
    required: false
    default: sts.amazonaws.com
runs:
  using: composite
  steps:
    - shell: bash
      env:
        LABEL: ${{ inputs.label }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::warning::No OIDC token available: job lacks id-token: write"
          exit 0
        fi
        token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
        echo "::add-mask::$token"
        payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
        while (( ${#payload} % 4 )); do payload+='='; done
        claims=$(base64 -d <<<"$payload" | jq -c '{sub, aud, ref, event_name, environment,
          workflow, workflow_ref, job_workflow_ref, job_workflow_sha,
          repository_id, repository_owner_id}')
        echo "OIDC claims: $LABEL"
        echo "$claims" | jq .
